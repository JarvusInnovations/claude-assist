name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history so `git describe --tags` can version the skill bundles.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".tool-versions"

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build core
        run: bun run --filter @jarvus/claude-assist-core build

      - name: Build sessions
        run: bun run --filter @jarvus/claude-assist-sessions build

      - name: Build google
        run: bun run --filter @jarvus/claude-assist-google build

      - name: Build capture
        run: bun run --filter @jarvus/claude-assist-capture build

      - name: Build chat
        run: bun run --filter @jarvus/claude-assist-chat build

      - name: Build notify
        run: bun run --filter @jarvus/claude-assist-notify build

      - name: Build session-spawn
        run: bun run --filter @jarvus/claude-assist-session-spawn build

      - name: Build slack-urgency
        run: bun run --filter @jarvus/claude-assist-slack-urgency build
      - name: Build briefing
        run: bun run --filter @jarvus/claude-assist-briefing build

      - name: Build pages
        run: bun run --filter @jarvus/claude-assist-pages build
      - name: Build ledger
        run: bun run --filter @jarvus/claude-assist-ledger build

      - name: Build kitchen
        run: bun run --filter @jarvus/claude-assist-kitchen build

      - name: Build server
        run: bun run --filter @jarvus/claude-assist-server build

      - name: Type-check skill CLIs
        run: bun run type-check:axi

      - name: Check skill bundles & SKILL.md are up to date
        run: bun run check:skills

      # `bun run test` (the root script → `bun run --filter '*' test`), NOT a bare
      # `bun test`. Each package's own test script runs with that package as cwd,
      # which is what lets a package-level `bunfig.toml` apply — `packages/kitchen`
      # uses one to preload a TZ pin for its date/timezone assertions. A bare
      # `bun test` from the repo root walks the whole tree in one process, never
      # reads any package bunfig, and so fails those assertions on every run.
      #
      # And no `continue-on-error`. It was here masking exactly that failure, which
      # made this step decorative: the job reported success with 32 failing
      # assertions, so a real regression would also have gone green.
      - name: Run tests
        run: bun run test

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          load: true
          tags: claude-assist:ci
